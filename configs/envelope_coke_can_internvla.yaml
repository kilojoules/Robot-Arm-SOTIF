# Safe Operating Envelope: Pick Coke Can with InternVLA-M1
#
# Mirrors envelope_eggplant_internvla_stress.yaml but on the coke-can task
# used by the LOO safety-monitor study, so envelope and LOO share a task.
#
# Run with:
#   python -m adversarial_dust.run_envelope \
#       --config configs/envelope_coke_can_internvla.yaml

env:
  task_name: "google_robot_pick_coke_can"
  policy_model: "internvla-m1"
  max_episode_steps: 100
  internvla_m1_port: 10093
  internvla_m1_ckpt: "/root/internvla_m1_ckpt/checkpoints/steps_50000_pytorch_model.pt"

envelope:
  # Extended to the full 9-corruption taxonomy so we can report an envelope
  # per row of Table I. Start with the two for which we have prior rollouts;
  # comment in the rest as compute allows.
  occlusion_types:
    - fingerprint
    - glare
    - rain
    - defocus_blur
    - motion_blur
    - dust_camera
    - low_light
    - gaussian_noise
    - jpeg
  budget_levels:
    - 0.10
    - 0.30
    - 0.50
    - 0.70
    - 0.90
  episodes_per_eval: 3
  episodes_final_eval: 10
  population_size: 8
  max_generations: 5
  sigma0: 0.3
  seed: 42
  n_random_baselines: 3
  safe_threshold: 0.95
  marginal_threshold: 0.70

fingerprint:
  num_prints: 15
  max_opacity: 1.0
  smudge_color: [80, 65, 40]
  dirty_threshold: 0.15
  scale_range: [0.05, 0.15]
  freq_range: [3.0, 15.0]

glare:
  max_intensity: 0.8
  num_streaks: 6
  chromatic_aberration: 1.5
  ghost_count: 4
  ghost_spacing: 0.4
  ghost_decay: 0.85
  dirty_threshold: 0.05

output_dir: "results/envelope_coke_can_internvla"
